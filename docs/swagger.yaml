            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update spirit score (Admin only)
      tags:
      - admin
  /admin/system/health:
