info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for DigiGameStats reimplementation.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: DigiGameStats API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: Get all audit log entries, newest first
      parameters:
      - default: 50
        description: Limit results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_presentation_http_handlers.AuditLogDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit logs (Admin only)
      tags:
      - admin
  /admin/audit-logs/export:
    post:
      consumes:
      - application/json
      description: Returns a CSV file containing audit logs based on filters
      parameters:
      - description: Audit log filter parameters
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_presentation_http_handlers.ListAuditLogsParams'
      produces:
      - text/csv
      responses:
        "200":
          description: CSV data
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Export audit logs to CSV (Admin only)
      tags:
      - admin
  /admin/export/{type}:
    get:
      description: Exports events, games, teams, or users in CSV or JSON format
      parameters:
      - description: Data type (events, games, teams, users)
        in: path
        name: type
        required: true
        type: string
      - default: csv
        description: Export format (csv, json)
        in: query
        name: format
        type: string
      responses:
        "200":
          description: Export data
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Export system data (Admin only)
      tags:
      - admin
  /admin/games/{id}/audit:
    get:
      description: Retrieves all administrative changes made to a game
      parameters:
      - description: Game ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
