        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get game audit history (Admin only)
      tags:
      - admin
  /admin/games/{id}/score:
    put:
      consumes:
      - application/json
      description: Updates a game's score with audit trail
      parameters:
      - description: Score update request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_presentation_http_handlers.UpdateGameScoreRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bengobox_game-stats-api_internal_application_admin.UpdateGameScoreResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_presentation_http_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update game score (Admin only)
      tags:
      - admin
  /admin/games/{id}/sync:
